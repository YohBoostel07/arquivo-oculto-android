name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Exportar APK instalável
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Baixar projeto limpo
        uses: actions/checkout@v4

      - name: Preparar configurações do Godot no runner
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cp -a /root/.local/share/godot/export_templates "$HOME/.local/share/godot/"
          if [ ! -s /root/debug.keystore ]; then
            keytool -genkeypair -v -keystore /root/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s /root/debug.keystore
          mkdir -p build

      - name: Conferir ferramentas e templates Android
        run: |
          godot --version
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/33.0.2"

      - name: Importar e validar projeto
        run: godot --headless --editor --path . --quit

      - name: Gerar APK Android arm64
        run: godot --headless --verbose --path . --export-debug "Android" build/ArquivoOculto.apk

      - name: Validar arquivo APK
        run: |
          test -s build/ArquivoOculto.apk
          unzip -t build/ArquivoOculto.apk
          ls -lh build/ArquivoOculto.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Arquivo-Oculto-APK
          path: build/ArquivoOculto.apk
          if-no-files-found: error
          retention-days: 14
