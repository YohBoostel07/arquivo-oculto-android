name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar ambiente Android do Godot
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cp -a /root/.local/share/godot/export_templates "$HOME/.local/share/godot/"

      - name: Garantir chave de depuração Android
        run: |
          if [ ! -s /root/debug.keystore ]; then
            keytool -genkeypair -v -keystore /root/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s /root/debug.keystore

      - name: Validar projeto Godot
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --quit-after 5

      - name: Instalar modelo de compilação Android do Godot
        run: timeout 180s godot --headless --editor --path . --install-android-build-template --quit

      - name: Preparar diretório de saída
        run: mkdir -p build

      - name: Diagnosticar ambiente de exportação Android
        run: |
          echo "HOME=$HOME"
          echo "Godot:"
          godot --version
          echo "Templates instalados:"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type d -print
          echo "Android SDK platforms:"
          ls -la "$ANDROID_HOME/platforms" || true
          echo "Android SDK build-tools:"
          ls -la "$ANDROID_HOME/build-tools" || true
          echo "Configurações Android do Godot (sem senhas):"
          grep -E '^(export/android|export/android_sdk|export/android_debug_keystore)' "$HOME/.config/godot"/editor_settings-*.tres | sed -E 's/(password|pass)[^=]*=.*/\\1=<oculto>/I' || true

      - name: Exportar APK de depuração
        run: godot --headless --verbose --path . --export-debug "Android" build/ArquivoOculto.apk

      - name: Verificar APK gerado
        run: test -s build/ArquivoOculto.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Arquivo-Oculto-Android-APK
          path: build/ArquivoOculto.apk
          if-no-files-found: error
          retention-days: 14
