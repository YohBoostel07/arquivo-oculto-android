name: Validar projeto Godot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Validar projeto em modo headless
        run: godot --headless --editor --path . --quit
      - name: Verificar cena principal
        run: godot --headless --path . --quit-after 5
